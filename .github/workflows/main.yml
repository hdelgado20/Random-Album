name: Build 3DS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          MK=$(find . -maxdepth 3 -name Makefile -not -path './.git/*' | head -n 1)
          if [ -z "$MK" ]; then
            echo "No encuentro el Makefile. Archivos del repositorio:"
            find . -maxdepth 3 -not -path './.git/*'
            exit 1
          fi
          cd "$(dirname "$MK")"
          make
      - uses: actions/upload-artifact@v4
        with:
          name: DiscoAleatorio-3ds
          path: |
            **/DiscoAleatorio.3dsx
